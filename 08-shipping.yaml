- name: Configure shipping server 
  hosts: shipping
  become: yes
  tasks:
    - name: enable maven 3.9
      command: dnf module enable maven:3.9 -y

    - name: Install maven and java 
      dnf:
        name:
          - maven 
          - java-25-openjdk-devel
        state: present

    # - name: find java25 path 
    #   shell:  readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
    #   register: java25 

    # - name: print the output
    #   debug:
    #     msg: "{{ java25 }}"
      
    # - name: make java25 as default
    #   command: alternatives --config java {{ java25.stdout }}

    # - name: set JAVA_HOME 
    #   copy:
    #     content: "export JAVA_HOME={{ java25.stdout | dirname | dirname }}"
    #     dest: /etc/profile.d/java.sh
    
    - name: create roboshop system user 
      user:
        name: roboshop
        create_home: false
        home: /app 
        shell: /sbin/nologin
        system: true 
        comment: "roboshop system user"

    - name: Remove existing app directory
      file:
        path: /app
        state: absent

    - name: Remove shippin.zip 
      file:
        path: /tmp/shipping.zip
        state: absent
    
    - name: create app directory
      file:
        path: /app
        state: directory

    - name: Download shipping application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
        dest: /tmp/shipping.zip

    - name: Unzip shipping 
      unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes
    
    - name: maven version with JAVA_HOME 
      command: mvn --version
      args:
        chdir: /app
      register: mvn_default

    - name: print maven version without JAVA_HOME 
      debug:
        msg: "{{ mvn_default.stdout_lines }}"

    - name: build shipping 
      command: mvn clean package
      args:
        chdir: /app 



