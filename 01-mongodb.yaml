- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks: 
    - name: copy mongo repo 
      copy:
        src: mongo.repo 
        dest: /etc/yum.repos.d/mongo.repo
      
    # - name: test inventory variable
    #   debug:
    #     msg: "{{ app_name }}"

    - name: Install mongodb server 
      package:
        name: mongodb-org 
        state: present 

    - name: start and enable mongodb 
      service:
        name: mongod
        state: started 
        enabled: yes 
    
    - name: replace value in mongod config 
      replace:
        path: /etc/mongod.conf
        regexp: 127.0.0.1
        replace: 0.0.0.0

    - name: restart the server
      service:
        name: mongod
        state: restarted




