- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks: 
    - name: copy mongo repo 
      copy:
        src: mongo.repo 
        dest: /etc/yum.repos.d/mongo.repo
      
    # - name: test inventory variable
    #   debug:
    #     msg: "{{ app_name }}"

    - name: Install mongodb
      package:
        name: mongodb
        state: present

    - name: start and enable mongodb 
      service:
        name: mongodb 
        state: started
        enabled: yes
    
          
