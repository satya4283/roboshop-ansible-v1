- name: Configure mysql server 
  hosts: mysql 
  tasks:
    - name: enable mysql module
      command: dnf module enable mysql:8.4 -y

    - name: Install mysql server
      package:
        name: mysql-server
        state: present
      
    - name: Enable and start the server
      service:
        name: mysqld 
        state: started
        enabled: yes

    - name: setup root password 
      command: mysql_secure_installation --set-root-pass "{{ mysq_root_password }}"

      