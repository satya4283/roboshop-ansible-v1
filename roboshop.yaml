- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    instances: [mongodb, redis, mysql, rabbitmq]
    action: create
    ami_id: ami-0055977a6e828a4f4
    domain_name: daws92ss.store

  tasks:
    - name: Create ec2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: action == 'create' 
      register: ec2_output

    # - name: print ec2 output
    #   debug:
    #     msg: "{{ ec2_output }}"

#ec2_output.results -- list
#loop the list
# {{item.instances[0].private_ip_address}}
#loop: "{{ec2_output.results}}"


    - name: create r53 record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results}}"
      when: action == "create"

    - name: Delete r53 records
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
        ttl: 1
        wait: false
      loop: "{{ instances }}"
      when: action == "delete"

    - name: Delete EC2 instance
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item }}"
        region: us-east-1
        wait: false
      loop: "{{ instances }}"



