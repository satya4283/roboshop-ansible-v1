- name: create ec2 and r53
  hosts: local
  connection: local
  vars:
    instances: [mongodb, redis]
    action: create
    ami_id: ami-0055977a6e828a4f4

  tasks:
    - name: Create ec2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: us-east-1
      loop: "{{ instances }}"
      when: action == 'create' 
      register: ec2_output

    - name: print ec2 output
      debug:
        msg: "{{ ec2_output }}"

