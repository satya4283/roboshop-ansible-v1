- name: Configure cart server
  hosts: cart
  become: yes 
  tasks:
    - name: disable default nodjs  
      command: dnf module disable nodejs -y

    - name: Enable nodjs24
      command: dnf module enable nodejs:24 -y

    - name: Instll nodjs 
      dnf:
        name: nodejs 
        state: present

    - name: create roboshop system user 
      user:
        name: roboshop
        create_home: false
        home: /app 
        shell: /sbin/nologin
        system: true 
        comment: "roboshop system user"

    - name: Remove existing app directory
      file:
        path: /app
        state: absent

    - name: Remove cart.zip 
      file:
        path: /tmp/cart.zip
        state: absent
    
    - name: create app directory
      file:
        path: /app
        state: directory

    - name: Download cart application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-v4.zip
        dest: /tmp/cart.zip

    - name: Unzip cart 
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes
    
    - name: Install dependepcies 
      community.general.npm:
        path: /app
        state: present

    - name: copy cart service 
      template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service

    - name: demon reload 
      systemd_service:
        daemon_reload: true

    - name: start and enable cart 
      service:
        name: cart 
        state: restarted
        enabled: yes
